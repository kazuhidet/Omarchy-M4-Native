# Candidate J715 (15-inch M4 Air, AID38) model for speakersafetyd built with
# the j715 feature; not installed by this repository yet.
# Channels follow the ADT amplifier order 0x38, 0x3b, 0x39, 0x3c, 0x3a, 0x3d,
# each with V and I sense in the J715 module's twelve S16 feedback slots.
# Thermal values: macOS AID38 SpeakerProtect (spp3) per channel, mapped as
# T_sett_vc -> tr_coil, T_sett_mg -> tr_magnet, tau_Tvc -> tau_coil,
# tau_Tmg -> tau_magnet (README.md), except:
# - tweeter tr_coil/tr_magnet stay the J713 candidate 140/200, higher (more
#   conservative) than AID38's 124/89.8 and 129/87.2;
# - t_limit stays the J713 candidate 120 C (AID38: 140 C);
# - z_nominal is AID38's lowest Reb for each channel, not one unit's
#   calibration: it only scales the startup peak-power bound, and a lower
#   value attenuates more.
[Globals]
visense_pcm = 0
channels = 12
period = 1024
t_ambient = 50.0
t_window = 15.0
t_hysteresis = 5.0

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

[Speaker/Left Woofer 1]
group = 0
tr_coil = 40
tr_magnet = 26
tau_coil = 3
tau_magnet = 35
t_limit = 120.0
t_headroom = 5.0
z_nominal = 3.375
is_scale = 3.75
vs_scale = 14.0
vs_chan = 0
is_chan = 1

